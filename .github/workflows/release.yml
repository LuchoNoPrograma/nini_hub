name: Release desktop

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify tag matches pubspec version
        shell: bash
        run: |
          package_version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${package_version}." >&2
            exit 1
          fi

      - name: Install Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-linux:
    name: Build Linux x86_64
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libgtk-3-dev liblzma-dev ninja-build pkg-config

      - name: Install Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build release bundle
        run: flutter build linux --release

      - name: Package release bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_name="Nini-Hub-${version}-linux-x86_64"
          package_dir="${RUNNER_TEMP}/${package_name}"
          mkdir -p "${package_dir}"
          cp -a build/linux/x64/release/bundle/. "${package_dir}/"
          tar -C "${RUNNER_TEMP}" -czf "${package_name}.tar.gz" "${package_name}"
          sha256sum "${package_name}.tar.gz" > "${package_name}.tar.gz.sha256"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64
          path: |
            Nini-Hub-*-linux-x86_64.tar.gz
            Nini-Hub-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build release bundle
        run: flutter build windows --release

      - name: Package release bundle
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageName = "Nini-Hub-$version-windows-x64"
          $packageDirectory = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Path $packageDirectory | Out-Null
          Copy-Item -Path 'build\windows\x64\runner\Release\*' -Destination $packageDirectory -Recurse -Force
          $archiveName = "$packageName.zip"
          Compress-Archive -Path $packageDirectory -DestinationPath $archiveName -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Out-File -FilePath "$archiveName.sha256" -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: |
            Nini-Hub-*-windows-x64.zip
            Nini-Hub-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check *.sha256

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Nini Hub ${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${GITHUB_REF_NAME}" --prerelease --title "${title}" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --generate-notes \
              --prerelease \
              --title "${title}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
